services:
  postgres:
    # Matches the test/dev DB convention every suite defaults to
    # (postgres://moyasar_ops:dev_password@localhost:5433/moyasar_ops).
    image: postgres:16
    environment:
      POSTGRES_USER: moyasar_ops
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: moyasar_ops
    ports: ["5433:5432"]

  keycloak:
    # Dev-only mock OIDC provider so the real sign-in flow can be exercised
    # locally without a real Entra tenant. Never used in production.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
