services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moyasar_ops
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: moyasar_ops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moyasar_ops -d moyasar_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
